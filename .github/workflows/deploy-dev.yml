name: Deploy Dev to GitHub Pages

on:
  push:
    branches: ["dev"]


# `false` з тієї ж причини, що й у deploy.yml: скасований проміжний прогін —
# це крок, про який неможливо сказати, чи він виконувався (AI-AGENT-PITFALLS-v8
# § 1.4).
concurrency:
  group: "pages-dev"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Гейти якості тут БУЛИ ВІДСУТНІ свідомо («це прев'ю, а не реліз»), і саме
      # це виявилося помилкою: `dev` — гілка, у якій пишеться код, тож перший
      # прогін перевірок припадав уже на мерж у `main`, коли вартість відкату
      # найвища (CI-CD-AND-TOOLS-v9 § 1.12, `CI-PRE-MERGE-GATE`, HIGH).
      #
      # Набір тут коротший за реліз: типи, лінт і юніти — те, що не потребує ні
      # браузерів, ні збірки. E2E і Lighthouse лишаються в `deploy.yml`.
      - name: Types and Svelte check
        run: npm run check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test:unit

      - name: Build
        id: build
        env:
          BASE_PATH: "/Slovko/dev"
        run: npm run build

      # CI-CD-AND-TOOLS-v9 § 1.5 — те саме, що й у deploy.yml: артефакт збірки
      # не має права мовчки міняти відстежувані файли й у цій гілці теж.
      - name: Збірка не змінює відстежувані файли
        run: git diff --exit-code

      - name: Deploy to GitHub Pages (dev subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: dev
