name: Deploy Dev to GitHub Pages

on:
  push:
    branches: ["dev"]

permissions:
  contents: write

# `false` з тієї ж причини, що й у deploy.yml: скасований проміжний прогін —
# це крок, про який неможливо сказати, чи він виконувався (AI-AGENT-PITFALLS-v8
# § 1.4).
concurrency:
  group: "pages-dev"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: "/Slovko/dev"
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: npm run build

      # CI-CD-AND-TOOLS-v8 § 1.5 — те саме, що й у deploy.yml. Гейтів якості тут
      # свідомо немає (це прев'ю, а не реліз), але артефакт збірки не має права
      # мовчки міняти відстежувані файли й у цій гілці теж.
      - name: Збірка не змінює відстежувані файли
        run: git diff --exit-code

      - name: Deploy to GitHub Pages (dev subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: dev
