name: Budgets

# CI-CD-AND-TOOLS-v9 § 1.18 — пороговий бюджет не тримає випуск заручником.
#
# ЧОМУ ОКРЕМИЙ ВОРКФЛОУ
#
# `check:bundle` стояв у `deploy.yml` між збіркою і публікацією, тобто його
# падіння зупиняло викладання сайту. Заміряно на прогоні CV 35196420932: деплой
# упав на «ДАНІ 133 КБ gzip перевищують бюджет 131». Спрацювання законне — але
# приріст був ПЕРЕКЛАДОМ: картку десятого проєкту додали в 42 словники, коду не
# додано ні рядка. Сайт при цьому не поїхав.
#
# Це помилка категорії. Бюджет розміру відповідає на «чи продукт не гладшає» —
# це тренд. Блокувальний набір відповідає на «чи продукт цілий»: збирається,
# віддає сторінки, не зламаний, не дірявий.
#
# І такий гейт флакі за побудовою: він порівнює ЗМІРЯНЕ число з жорстким
# порогом, а вимір залежить від машини. Заміряно в `teatralo4ka` 2026-09-16:
# деплой упав на «758 КБ > 758», тоді як локальна збірка ТОГО САМОГО дерева дала
# 757.78. Кількасот байтів різниці між раннерами — більше за типовий запас, тобто
# випуск зупинявся без жодної зміни в коді. Причину лікує допуск `TOLERANCE_KB`
# у самому скрипті (§ 1.18.1); цей файл лікує наслідок — заручництво випуску.
#
# ЧОМУ ПАРАЛЕЛЬНО, А НЕ `workflow_run` ПІСЛЯ ДЕПЛОЮ
#
# Обидві форми канонічні (§ 1.18.2), і дефолт — ця. `workflow_run` має чотири
# способи тихо не запуститися: файл читається лише з гілки за замовчуванням;
# назва в `workflows:` мусить збігатися дослівно; без `ref: head_sha` чекаутиться
# голова гілки, а не опублікований коміт; при впалому деплої прогін не стартує
# взагалі. Кожен дає гейт, якого немає, а виглядає він як зелений.
#
# Ціна цієї форми названа: зайві `npm ci` + `build` на кожен push. У `teatralo4ka`
# саме вона й стала причиною переїзду на `workflow_run` — там у ті самі хвилини
# стояли ще два прогони гейтів на кожен Dependabot-PR. Тут такого змагання немає.
#
# ЩО ЦЕ КОШТУЄ
#
# Перевищення бюджету тепер МОЖЕ потрапити в продакшн і буде видне за кілька
# хвилин після push, а не до публікації. Свідомий обмін: затримка виправлення
# тексту коштує дорожче за кілобайт чанка.

on:
  push:
    branches: ["main"]
  # Кнопка на випадок «перевірити поточний стан, нічого не пушачи».
  workflow_dispatch:

# Та сама причина, що й у деплої: пуш пачкою комітів при `true` лишає лише
# останній прогін, і бюджет, перевищений у проміжному коміті, не перевіряється
# ЖОДНОГО разу.
concurrency:
  group: budgets
  cancel-in-progress: false

jobs:
  budgets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Для кроку, що заводить Issue при падінні (§ 1.18.3).
      issues: write
    # Тут лише збірка й один скрипт; двадцять — це приблизно подвоєний здоровий
    # прогін, як вимагає § 1.13.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      # CI-CD-AND-TOOLS-v9 § 1.5 — «артефакт збірки не комітиться». Крок потрібен
      # у КОЖНОМУ воркфлоу, що збирає, а не лише в деплої: тут він заразом
      # охороняє сам замір — брудне дерево після збірки означає, що build написав
      # щось непередбачене, і бюджет тоді міряє не те, що поїде на сайт.
      - name: Збірка не змінює відстежувані файли
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code

      # ЖОРСТКО: `BUDGET_SOFT` тут не ставиться навмисно. Гейт, який після
      # винесення ніде не падає, не винесений, а вимкнений (§ 1.18).
      - name: Check JS budget
        id: budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:bundle

      # § 1.18.3: знятий із блокувального шляху храповик тримається на тому, що
      # хтось відкриє Actions. Без сигналу бюджет тихо дрейфує місяцями, і момент
      # його зростання втрачено — а це рівно те, заради чого храповик існує.
      #
      # Issue, а не лише червона галочка: галочку видно тому, хто дивиться на
      # прогони, а Issue приходить поштою й лишається, доки його не закриють.
      # `github-script` замість стороннього екшена — менша поверхня залежностей.
      - name: Сигнал про перевищення
        if: ${{ failure() && steps.budget.outcome == 'failure' }}
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Бюджет початкового JS перевищено';
            const body = [
              'Прогін `Budgets` упав на `npm run check:bundle`.',
              '',
              `Коміт: ${context.sha}`,
              `Прогін: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Сайт при цьому ВИКЛАДЕНО: бюджет не тримає випуск заручником',
              '(CI-CD-AND-TOOLS-v9 § 1.18). Числа й журнал стель — у',
              '`scripts/check-bundle.mjs`.',
              '',
              'Приріст ДАНИХ — рутина: підняти `DATA_KB` разом із рядком у журналі.',
              'Приріст КОДУ — рішення: спершу подивитися, що саме приїхало.'
            ].join('\n');

            // Один відкритий Issue на цю тему, а не по одному на кожен push:
            // десять однакових Issue привчають не дивитися на них узагалі.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'budget'
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['budget']
            });
