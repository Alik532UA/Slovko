name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

# Один деплой за раз — але проміжні прогони НЕ скасовуються.
#
# Було `cancel-in-progress: true`, і 2026-08-15 це вже коштувало: вісім комітів
# приїхали в `main` майже одночасно, група скасувала все, крім останнього, і
# прогін, який УПЕРШЕ виконав би свіжий гейт `Unique data-testid invariant`, не
# завершився ніколи. Гейт був червоний від народження, а виглядало це кілька
# днів як «усе зелено» (AI-AGENT-PITFALLS-v8 § 1.4, CI-CD-AND-TOOLS-v8 § 1.3).
#
# Ціна `false` — черга з прогонів при пуші пачкою. Ціна `true` — гейт, про який
# невідомо, чи він хоч раз виконувався.
concurrency:
  group: "pages-main"
  cancel-in-progress: false

jobs:
  # Правила доступу до бази — ЄДИНА межа безпеки цього застосунку, і єдина його
  # частина, стан якої не видно ні в `src/`, ні у `build/`: вони виконуються на
  # боці Firebase (CLOUD-DATABASE-v8 § 3.4). Решта гейтів проходить однаково і на
  # правильних правилах, і на «дозволити все» — саме тому відсутність файлів
  # правил у репозиторії прожила в цьому проєкті до аудиту непоміченою.
  #
  # Окремий джоб, а не крок у деплої: емулятор вимагає Java й не потребує
  # збірки, тож деплой на нього не чекає.
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Емулятори Firestore і Realtime Database — java-процеси. Без цього кроку
      # `emulators:exec` падає з «java not found», і це виглядає як зламані правила.
      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # 55 випадків: 20 «застосунок мусить це вміти» й 35 «сторонній не мусить
      # цього могти». Правила «дозволити все» валять другий набір, «заборонити
      # все» — перший; скрипт сам падає, якщо один із наборів спорожнів.
      #
      # Числа тут звіряються з `check-rules.mjs` гейтом `docs-numbers.test.ts`:
      # доти в цьому коментарі стояло «36: 14 і 22» — склад набору, якого вже
      # півтора роки як немає, тобто читач CI бачив третину справжнього.
      - name: Перевірка правил доступу
        run: npm run check:rules

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # Юніт-тести існували в репозиторії і не виконувалися в CI жодного разу
      # (CODE-QUALITY-v8 § 6.5 — той самий CRITICAL, що й тест-заглушка:
      # обіцянка перевірки без перевірки). Кількість тут навмисно не названа:
      # число, яке треба правити щоразу при додаванні перевірки, розходиться
      # з дійсністю швидше, ніж його встигають прочитати.
      - name: Unit tests
        run: npm run test:unit

      # Рантайм-інваріант унікальності data-testid (TESTID-AND-NAMING-v8 § 1.9.2)
      # плюс smoke: заголовок сторінки, опис, canonical і чиста консоль.
      # Статична перевірка в юніт-тестах бачить усі testid, але не бачить, що
      # один компонент відрендерився двічі. Саме так тут жили три дублікати:
      # картки слів у циклі й панелі двох модалок.
      #
      # Запускається ВЕСЬ каталог, а не окремий файл за іменем: доти будь-який
      # доданий спек мовчки не виконувався б (AI-AGENT-PITFALLS-v8 § 1.3).
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Змінні Firebase потрібні саме тут, а не лише на `Build`, і причина
      # змінилася: тепер `playwright.config.ts` сам виконує `npm run build`
      # перед прев'ю (CODE-QUALITY-v8 § 5.7), тож без цих змінних у бандл
      # поїхав би порожній конфіг — і всі перевірки ходили б по застосунку,
      # який до бази не під'єднується взагалі.
      #
      # Доти тут стояла інша причина: `config.ts` викликав `getDatabase(app)` у
      # тілі модуля й кидав без `databaseURL`. Так було до 2026-08-18; тепер
      # під'єднання ліниве, і той коментар описував код, якого вже немає.
      #
      # Це не секрети: web-конфіг Firebase публічний і так їде в клієнтський
      # бандл. Захист дають правила доступу — джоб `rules` вище.
      # Двокрапки в назві бути НЕ МОЖЕ: незакутий скаляр із `: ` YAML читає як
      # вкладене відображення, і весь файл стає невалідним. Саме так цей крок і
      # зламав пайплайн — див. інваріант «кожен workflow парситься» в ci.test.ts.
      - name: E2E (прев'ю зібраного сайту — testid invariant + smoke + axe)
        env:
          BASE_PATH: "/Slovko"
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Поріг high: після оновлення тут не лишилося взагалі нічого — ні high,
      # ні moderate, ні low. Але тримаю саме `high`, як у решті проєктів:
      # перший транзитивний moderate у firebase або svelte-i18n інакше
      # зупинив би деплой, і гейт довелося б вимикати — а вимкнений гейт
      # гірший за відсутній.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        env:
          BASE_PATH: "/Slovko"
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: npm run build

      # CI-CD-AND-TOOLS-v8 § 1.5 — перевірка, що збірка не змінює відстежувані файли
      - name: Збірка не змінює відстежувані файли
        run: git diff --exit-code

      # Єдиний гейт, який бачить дефекти, невидимі в src/ (SEO-v8 § 6.1):
      # sveltekit-prerender в адресах, зниклий canonical, інлайн-скрипт без
      # хеша в політиці, секрет у бандлі. Пререндер виконується з іншим origin
      # і відносним base, тож читання коду тут не доводить нічого.
      - name: Інваріанти зібраного виводу
        run: npm run check:build

      # PERFORMANCE-v8 § 10.1. Міряється КРИТИЧНИЙ ШЛЯХ — усе, що index.html
      # просить передзавантажити, — а не тека `entry`: у ній 2 КБ, бо Vite
      # ділить збірку по маршрутах, і бюджет над нею був би зеленим завжди.
      # Стеля 240 КБ при заміряних 214 і може лише знижуватися.
      - name: Бюджет бандла
        run: npm run check:bundle

      # CI-CD-AND-TOOLS-v8 § 1.5 — єдина машинна перевірка правила «артефакт
      # збірки не комітиться». Тут вона не декоративна: `static/app-version.json`
      # відстежується Git-ом і його переписує хук перед комітом, тож варто
      # збірці почати робити те саме — і задеплоєне розійдеться з репозиторієм.
      - name: Lighthouse Audit
        run: npx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Preserve dev folder from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show gh-pages:dev/ >/dev/null 2>&1; then
            git archive gh-pages -- dev/ | tar -x -C build/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
