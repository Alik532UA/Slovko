name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

# Один деплой за раз — але проміжні прогони НЕ скасовуються.
#
# Було `cancel-in-progress: true`, і 2026-08-15 це вже коштувало: вісім комітів
# приїхали в `main` майже одночасно, група скасувала все, крім останнього, і
# прогін, який УПЕРШЕ виконав би свіжий гейт `Unique data-testid invariant`, не
# завершився ніколи. Гейт був червоний від народження, а виглядало це кілька
# днів як «усе зелено» (AI-AGENT-PITFALLS-v8 § 1.4, CI-CD-AND-TOOLS-v8 § 1.3).
#
# Ціна `false` — черга з прогонів при пуші пачкою. Ціна `true` — гейт, про який
# невідомо, чи він хоч раз виконувався.
concurrency:
  group: "pages-main"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # 27 юніт-тестів існували в репозиторії і не виконувалися в CI жодного
      # разу (CODE-QUALITY-v8 § 6.5 — той самий CRITICAL, що й тест-заглушка:
      # обіцянка перевірки без перевірки).
      - name: Unit tests
        run: npm run test:unit

      # Рантайм-інваріант унікальності data-testid (TESTID-AND-NAMING-v8 § 1.9.2).
      # Статична перевірка в юніт-тестах бачить усі testid, але не бачить, що
      # один компонент відрендерився двічі. Саме так тут жили три дублікати:
      # картки слів у циклі й панелі двох модалок.
      #
      # Лише цей файл: перевіряє дев'ять станів (сторінка + п'ять модалок із
      # табами) і піднімає власний dev-сервер на порту 5273.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Змінні Firebase потрібні саме тут, а не лише на `Build`.
      # `src/lib/services/firebase/config.ts` виконує `getDatabase(app)` на
      # імпорті, а той кидає виняток без `databaseURL`. Playwright піднімає
      # власний dev-сервер, і без цих змінних SSR віддавав 500 на КОЖНОМУ з
      # дев'яти станів: тест чекав маркер до таймауту й звітував падіння, яке
      # виглядало як зламаний testid, хоча застосунок просто не завантажувався.
      # Локально гейт проходив, бо там є .env — тому й приїхав у main зеленим.
      # Це не секрети: web-конфіг Firebase публічний і так їде в клієнтський бандл.
      - name: Unique data-testid invariant
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
        run: npx playwright test tests/e2e/invariants.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Поріг high: після оновлення тут не лишилося взагалі нічого — ні high,
      # ні moderate, ні low. Але тримаю саме `high`, як у решті проєктів:
      # перший транзитивний moderate у firebase або svelte-i18n інакше
      # зупинив би деплой, і гейт довелося б вимикати — а вимкнений гейт
      # гірший за відсутній.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        env:
          BASE_PATH: "/Slovko"
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: npm run build

      # CI-CD-AND-TOOLS-v8 § 1.5 — єдина машинна перевірка правила «артефакт
      # збірки не комітиться». Тут вона не декоративна: `static/app-version.json`
      # відстежується Git-ом і його переписує хук перед комітом, тож варто
      # збірці почати робити те саме — і задеплоєне розійдеться з репозиторієм.
      - name: Збірка не змінює відстежувані файли
        run: git diff --exit-code

      - name: Preserve dev folder from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show gh-pages:dev/ >/dev/null 2>&1; then
            git archive gh-pages -- dev/ | tar -x -C build/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
