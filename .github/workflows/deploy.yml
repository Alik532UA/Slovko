name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

# Allow only one concurrent deployment
concurrency:
  group: "pages-main"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # 27 юніт-тестів існували в репозиторії і не виконувалися в CI жодного
      # разу (CODE-QUALITY-v8 § 6.5 — той самий CRITICAL, що й тест-заглушка:
      # обіцянка перевірки без перевірки).
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        env:
          BASE_PATH: "/Slovko"
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: npm run build

      - name: Preserve dev folder from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show gh-pages:dev/ >/dev/null 2>&1; then
            git archive gh-pages -- dev/ | tar -x -C build/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
